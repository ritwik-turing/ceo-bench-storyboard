<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEO Bench demo · Turing</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="demo-bar" hidden><span id="demo-say"></span><span id="demo-count"></span><div class="track"><span id="demo-fill" class="after"></span></div></div>
<header><div class="brand"><img class="logo" src="assets/turing-logo.svg" alt="Turing" width="132"><span class="product">CEO Bench <i>/</i> Live demo</span></div><nav id="steps" aria-label="Demo steps"></nav><div class="tools"><button id="play" class="primary">▶ Play demo</button><button id="notes-btn">Comment</button><a href="../narrative/" target="_blank" rel="noopener">Narrative ↗</a><button id="reset">Reset</button></div></header>
<div id="confirm" class="confirm" hidden role="alertdialog" aria-label="Reset session"><span>Clear the answer, rubric, and results on this browser? Comments are kept.</span><button id="reset-yes" class="primary">Reset</button><button id="reset-no">Cancel</button></div>
<main id="main"></main>
<aside id="notes-panel" hidden aria-label="Comments"><div class="row between"><b>Comment on this screen</b><button id="notes-close" aria-label="Close comments">×</button></div><span id="note-step" class="label"></span><textarea id="note-text" placeholder="What should change on this screen? To change copy, quote the old text and write the new text."></textarea><small id="notes-status" class="small">Comments save in this browser.</small><button id="notes-copy" class="primary">Copy all comments</button><textarea id="notes-all" hidden aria-label="All comments"></textarea><small class="small">Paste them into the Slack thread when you’re done.</small></aside>
<dialog id="detail" aria-labelledby="detail-title"><div class="row between"><h2 id="detail-title"></h2><button data-act="close-detail" aria-label="Close">×</button></div><div id="detail-body"></div></dialog>
<footer><button id="prev">← Previous</button><span id="where"></span><button id="next" class="primary">Next →</button></footer>
<script src="content.js"></script><script src="corpus.js"></script><script src="l1.js"></script><script src="data.js"></script><script src="app.js"></script></body></html>
